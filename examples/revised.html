<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>阅读工作台 — 我的书签与笔记</title>
<style>
  :root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    color: #20312f; background: #f3f4f0;
    --line: #c7cfca; --surface: #fff; --focus: #245b4e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: clamp(30px, 5vw, 42px); letter-spacing: -.04em; margin: 0; }
  .counter { color: #50645f; font-size: 14px; }
  .intro { max-width: 52ch; font-size: 16px; line-height: 1.7; margin: 18px 0 32px; }
  .workspace { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; align-items: start; }
  .reading-list { border-top: 1px solid var(--line); padding: 0; margin: 0; list-style: none; }
  .reading-list li { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .reading-list strong { display: block; font-size: 16px; }
  .reading-list span { font-size: 14px; color: #50645f; display: block; margin-top: 6px; }
  .panel { background: var(--surface); border: 1px solid #d6ddda; border-radius: 20px; padding: 12px; }
  .panel__inner { border-radius: 8px; padding: 18px; background: #f7f9f7; }
  .panel h2 { font-size: 20px; margin: 0 0 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  input { display: block; width: 100%; border: 1px solid #72877e; border-radius: 8px; padding: 12px; font: inherit; background: white; }
  button { margin-top: 12px; border: 0; border-radius: 8px; padding: 12px 18px; background: #245b4e; color: white; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #19483e; }
  :is(button, input):focus-visible { outline: 3px solid #ad7150; outline-offset: 3px; }
  #feedback { min-height: 24px; margin-top: 12px; font-size: 14px; color: #34534a; }
  @media (max-width: 720px) { .wrap { padding: 28px 18px 60px; } .workspace { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
<main class="wrap">
  <header><h1>阅读工作台</h1><span class="counter" id="counter">2 条收藏</span></header>
  <p class="intro">把值得回看的文章放在这里。保存标题，就能在稍后阅读时接着找到它。</p>
  <div class="workspace">
    <section aria-labelledby="list-heading">
      <h2 id="list-heading">待阅读</h2>
      <ul id="bookmarks" class="reading-list">
        <li><strong>如何写出更清晰的项目说明</strong><span>阅读笔记</span></li>
        <li><strong>一段关于城市夜行的散步记录</strong><span>生活随笔</span></li>
      </ul>
    </section>
    <section class="panel" aria-labelledby="add-heading">
      <div class="panel__inner">
        <h2 id="add-heading">加入一条收藏</h2>
        <form id="add-form">
          <label for="title">文章标题</label>
          <input id="title" name="title" maxlength="120" required placeholder="例如：周末读到的一篇好文章" />
          <button type="submit">保存标题</button>
        </form>
        <p id="feedback" role="status" aria-live="polite"></p>
      </div>
    </section>
  </div>
</main>
<script>
  const form = document.getElementById('add-form');
  const list = document.getElementById('bookmarks');
  const counter = document.getElementById('counter');
  const feedback = document.getElementById('feedback');
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const title = form.elements.title.value.trim();
    if (!title) { feedback.textContent = '请先输入文章标题。'; form.elements.title.focus(); return; }
    const item = document.createElement('li');
    const strong = document.createElement('strong');
    strong.textContent = title;
    item.appendChild(strong);
    list.appendChild(item);
    counter.textContent = `${list.children.length} 条收藏`;
    feedback.textContent = '标题已添加到当前页面。刷新后不会保留。';
    form.reset();
    form.elements.title.focus();
  });
</script>
</body>
</html>
