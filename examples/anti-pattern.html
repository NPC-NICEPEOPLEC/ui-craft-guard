<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>阅读工作台（故意包含反模式的教学样例）</title>
<style>
  body { margin: 0; font: 14px Arial, sans-serif; background: linear-gradient(125deg, #8b5cf6, #6366f1); }
  main { width: min(1040px, 94vw); margin: 40px auto; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.2em; font-size: 10px; }
  h1 { color: white; font-size: 58px; background: linear-gradient(90deg, white, #a855f7); background-clip: text; }
  p { font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: white; border-left: 5px solid purple; border-radius: 24px; padding: 16px; box-shadow: 0 10px 30px #0003; }
  .inner { border-radius: 24px; padding: 16px; background: #f0f0f0; }
  button { outline: none; transition: all 800ms; font-size: 15px; }
  small { font-size: 11px; }
</style>
</head>
<body>
<main>
  <span class="eyebrow">THE FUTURE OF READING</span>
  <h1>🚀 阅读工作台</h1>
  <p>一站式变革你的知识生产力，释放无限可能。</p>
  <div class="cards">
    <article class="card"><div class="inner"><h2>✨ 灵感</h2><p>Lorem ipsum</p><a href="#">查看详情</a></div></article>
    <article class="card"><div class="inner"><h2>🔥 计划</h2><p>即刻激发生产力</p><a href="javascript:void(0)">查看详情</a></div></article>
    <article class="card"><div class="inner"><h2>🎯 收藏</h2><p>进入未来</p><a href="#">查看详情</a></div></article>
  </div>
  <small>此页面故意包含多个设计与无障碍反模式，仅用于测试扫描器。</small>
</main>
</body>
</html>
